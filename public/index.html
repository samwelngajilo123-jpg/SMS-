<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Africa's Talking SMS Sender</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1e293b;
    padding: 2rem;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.25rem; margin-bottom: 1.25rem; color: #38bdf8; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #94a3b8; }
  input, textarea {
    width: 100%;
    padding: 0.6rem;
    margin-bottom: 1rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 0.95rem;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    width: 100%;
    padding: 0.7rem;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: #0ea5e9; }
  #result {
    margin-top: 1rem;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📲 Send SMS via Africa's Talking</h1>
    <label for="to">Phone number (e.g. +2557XXXXXXXX)</label>
    <input type="text" id="to" placeholder="+2557XXXXXXXX" />

    <label for="message">Message</label>
    <textarea id="message" placeholder="Type your message..."></textarea>

    <button onclick="sendSms()">Send SMS</button>
    <div id="result"></div>
  </div>

  <script>
    async function sendSms() {
      const to = document.getElementById('to').value.trim();
      const message = document.getElementById('message').value.trim();
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Sending...';

      try {
        const res = await fetch('/.netlify/functions/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, message })
        });
        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
